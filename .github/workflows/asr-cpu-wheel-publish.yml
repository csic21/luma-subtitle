name: Publish reviewed CPU wheel

# No request is generated here. Maintainer review creates a separate request-only
# commit whose sole parent is the exact successful native source proof.
on:
  pull_request:
    paths:
      - 'scripts/asr-components/ct2-cpu/**'
      - '.github/workflows/asr-cpu-wheel-publish.yml'
      - '.github/workflows/asr-ct2-cpu.yml'
      - 'scripts/prepare-release.cjs'
      - 'scripts/recover-release.cjs'
  push:
    branches: [feat/optional-asr-engines]
    paths: ['.github/asr-cpu-wheel-request.json']

permissions:
  contents: read

# Share serialization with application publication without changing its workflow.
# Read-only PR tests use a separate group and cannot block an app release.
concurrency:
  group: ${{ github.event_name == 'push' && 'luma-release-pipeline' || format('ct2-publisher-tests-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    name: CPU wheel publication guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test scripts/asr-components/ct2-cpu/publish.node-test.cjs scripts/asr-components/ct2-cpu/proof_request.node-test.cjs
      - run: python -B -m unittest discover -s scripts/asr-components/ct2-cpu -p 'test_package_publication.py' -v

  prepare:
    name: Validate reviewed wheel request
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      already_published: ${{ steps.prepare.outputs.already_published }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: prepare
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { prepareWheel } = require('./scripts/asr-components/ct2-cpu/publish.cjs');
            await prepareWheel({ github, context, core, inspectPublished: true });

  retrieve:
    name: Retrieve exact successful CPU proof artifact
    if: needs.prepare.outputs.already_published != 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_artifact_id: ${{ steps.candidate-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Retrieve only the reviewed successful source artifact
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { retrieveWheelArtifact } = require('./scripts/asr-components/ct2-cpu/publish.cjs');
            await retrieveWheelArtifact({ github, context, core,
              destination: 'dist/ct2-approved.zip', receiptPath: 'dist/ct2-approved.json' });
      - name: Extract exactly four pinned regular files without executing them
        run: >-
          python -B scripts/asr-components/ct2-cpu/package_publication.py
          --extract-approved-artifact "$GITHUB_WORKSPACE/dist/ct2-approved.zip"
          --approval "$GITHUB_WORKSPACE/dist/ct2-approved.json"
          --output "$GITHUB_WORKSPACE/dist/ct2-cpu-candidate"
      - name: Revalidate source proof and every extracted payload
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { validateRetrievedWheel } = require('./scripts/asr-components/ct2-cpu/publish.cjs');
            await validateRetrievedWheel({ github, context, root: 'dist/ct2-cpu-candidate' });
      - id: candidate-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ct2-reviewed-handoff-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          path: |
            dist/ct2-cpu-candidate/ctranslate2-4.8.2-1lumacpu-cp312-cp312-win_amd64.whl
            dist/ct2-cpu-candidate/luma-ct2-cpu-4.8.2-1-sources.zip
            dist/ct2-cpu-candidate/luma-ct2-cpu-4.8.2-1-notices.zip
            dist/ct2-cpu-candidate/publication-proof.json

  publish:
    name: Publish exact immutable CPU wheel
    if: github.event_name == 'push' && needs.prepare.outputs.already_published != 'true'
    needs: [prepare, retrieve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the request-only reviewed controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Exact same-run artifact ID from the validated retrieval, including when only
      # the publisher is retried. No token or cross-run download/Actions grant.
      # Every downloaded byte is compared with the reviewed proof pins.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.retrieve.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: dist/ct2-cpu-candidate
      - name: Recheck native provenance and keep application latest unchanged
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { publishWheel } = require('./scripts/asr-components/ct2-cpu/publish.cjs');
            await publishWheel({ github, context, core, root: 'dist/ct2-cpu-candidate' });
