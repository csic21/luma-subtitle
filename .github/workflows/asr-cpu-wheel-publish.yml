name: Publish reviewed CPU wheel

# No request is generated here. Maintainer review creates a separate request-only
# commit whose sole parent is the exact successful native source proof.
on:
  pull_request:
    paths:
      - 'scripts/asr-components/ct2-cpu/**'
      - '.github/workflows/asr-cpu-wheel-publish.yml'
      - '.github/workflows/asr-ct2-cpu.yml'
      - 'scripts/prepare-release.cjs'
      - 'scripts/recover-release.cjs'
  push:
    branches: [feat/optional-asr-engines]
    paths: ['.github/asr-cpu-wheel-request.json']

permissions:
  contents: read

# Share serialization with application publication without changing its workflow.
# Read-only PR tests use a separate group and cannot block an app release.
concurrency:
  group: ${{ github.event_name == 'push' && 'luma-release-pipeline' || format('ct2-publisher-tests-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    name: CPU wheel publication guard tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test scripts/asr-components/ct2-cpu/publish.node-test.cjs scripts/asr-components/ct2-cpu/proof_request.node-test.cjs
      - run: python -B -m unittest discover -s scripts/asr-components/ct2-cpu -p 'test_package_publication.py' -v

  prepare:
    name: Validate reviewed wheel request
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      already_published: ${{ steps.prepare.outputs.already_published }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: prepare
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        with:
          script: |
            const { prepareWheel } = require('./scripts/asr-components/ct2-cpu/publish.cjs');
            await prepareWheel({ github, context, core, inspectPublished: true });

  build:
    name: Rebuild reviewed CPU wheel
    if: needs.prepare.outputs.already_published != 'true'
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/asr-ct2-cpu.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      publication: true

  publish:
    name: Publish exact immutable CPU wheel
    if: github.event_name == 'push' && needs.prepare.outputs.already_published != 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the request-only reviewed controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # Exact same-run artifact ID from the successful build, including when only
      # the publisher is retried. No token or cross-run download/Actions grant.
      # Every downloaded byte is compared with the reviewed proof pins.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.candidate_artifact_id }}
          merge-multiple: true
          path: dist/ct2-cpu-candidate
      - name: Recheck native provenance and keep application latest unchanged
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7.0.1
        with:
          script: |
            const { publishWheel } = require('./scripts/asr-components/ct2-cpu/publish.cjs');
            await publishWheel({ github, context, core, root: 'dist/ct2-cpu-candidate' });
