name: CPU-only CTranslate2 proof

on:
  pull_request:
    paths:
      - 'scripts/asr-components/ct2-cpu/**'
      - 'scripts/asr-components/assemble.py'
      - 'scripts/asr-components/packs.json'
      - 'scripts/asr-components/fixtures.json'
      - 'scripts/asr-components/locks/faster-whisper-cpu-windows-x64.json'
      - 'src-tauri/src/asr/worker.py'
      - '.github/workflows/asr-ct2-cpu.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit (blank uses this ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-cpu-proof:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Test input locks and binary inventory logic
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10) and sys.maxsize > 2**32"
          python -B -m unittest discover -s scripts/asr-components/ct2-cpu -p 'test_*.py' -v
      - name: Inventory official toolchain and build two CPU wheels
        shell: pwsh
        run: |
          $orchestrator = Join-Path $env:pythonLocation 'python.exe'
          $reports = Join-Path $env:GITHUB_WORKSPACE 'dist/ct2-cpu-reports'
          . ./scripts/asr-components/ct2-cpu/prepare_toolchain.ps1 -Reports $reports -Lock 'scripts/asr-components/ct2-cpu/sources.lock.json'
          & $orchestrator -B scripts/asr-components/ct2-cpu/build_cpu.py `
            --source-sha "$env:SOURCE_SHA" `
            --work "$env:RUNNER_TEMP/luma-ct2-cpu-proof" `
            --cache "$env:RUNNER_TEMP/luma-ct2-cpu-downloads" `
            --reports "$reports" `
            --worker 'src-tauri/src/asr/worker.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Deliberately no wheel/CRT/runtime artifact upload, release, or write token.
      # The independent provenance, CRT license, hash and native inference review
      # must finish before a separate immutable non-app component release exists.
      - name: Upload test reports only (binary redistribution hold)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ct2-cpu-proof-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/ct2-cpu-reports/*.json
            dist/ct2-cpu-reports/*.log
            dist/ct2-cpu-reports/*-CMakeCache.txt
