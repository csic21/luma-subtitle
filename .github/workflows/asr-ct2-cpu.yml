name: CPU-only CTranslate2 proof

on:
  pull_request:
    paths:
      - 'scripts/asr-components/ct2-cpu/**'
      - 'scripts/asr-components/fixture_paths.py'
      - 'scripts/asr-components/test_fixture_paths.py'
      - 'scripts/asr-components/assemble.py'
      - 'scripts/asr-components/packs.json'
      - 'scripts/asr-components/fixtures.json'
      - 'scripts/asr-components/locks/faster-whisper-cpu-windows-x64.json'
      - 'src-tauri/src/asr/worker.py'
      - '.github/workflows/asr-ct2-cpu.yml'
  push:
    branches: [feat/optional-asr-engines]
    paths: ['.github/requests/ct2-cpu-proof.json']
  workflow_call:
    inputs:
      source_sha:
        description: Exact reviewed source commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit (blank uses this ref)
        required: false
        type: string

permissions:
  contents: read

# PR revisions replace only cheap source checks. Native work requires an explicit
# proof request or pinned manual/reusable invocation and survives later PR pushes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ct2-cpu-pr-{0}', github.event.pull_request.number) || format('ct2-cpu-proof-{0}-{1}', inputs.source_sha || github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-tests:
    name: CPU proof source guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - run: |
          python -B -m unittest discover -s scripts/asr-components -p 'test_fixture_paths.py' -v
          python -B -m unittest discover -s scripts/asr-components/ct2-cpu -p 'test_*.py' -v
      - run: node --test scripts/asr-components/ct2-cpu/publish.node-test.cjs scripts/asr-components/ct2-cpu/proof_request.node-test.cjs

  request:
    name: Validate request-only CPU proof
    if: github.event_name == 'push' && !inputs.source_sha && github.workflow == 'CPU-only CTranslate2 proof' && github.workflow_ref == 'csic21/luma-subtitle/.github/workflows/asr-ct2-cpu.yml@refs/heads/feat/optional-asr-engines'
    needs: source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      diagnostic_artifact: ${{ steps.request.outputs.diagnostic_artifact }}
      success_artifact: ${{ steps.request.outputs.success_artifact }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: request
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { prepareCpuProof } = require('./scripts/asr-components/ct2-cpu/proof_request.cjs');
            await prepareCpuProof({ github, context, core });

  windows-cpu-proof:
    # Fail before compilation if the independent original CRT identity proof fails.
    needs: [source-tests, request, windows-direct-crt-signatures]
    if: always() && !cancelled() && needs.source-tests.result == 'success' && needs.windows-direct-crt-signatures.result == 'success' && (needs.request.result == 'success' || inputs.source_sha || github.event_name == 'workflow_dispatch')
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SOURCE_SHA: ${{ inputs.source_sha || needs.request.outputs.source_sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CPU_DIAGNOSTIC_EXPORT: ${{ needs.request.outputs.diagnostic_artifact == 'cpu-wheel-source-notices-1-day' && github.repository == 'csic21/luma-subtitle' && github.event_name == 'push' && github.ref == 'refs/heads/feat/optional-asr-engines' && !inputs.source_sha && github.workflow == 'CPU-only CTranslate2 proof' && github.workflow_ref == 'csic21/luma-subtitle/.github/workflows/asr-ct2-cpu.yml@refs/heads/feat/optional-asr-engines' }}
      CPU_CANDIDATE_EXPORT: ${{ needs.request.result == 'success' && needs.request.outputs.success_artifact == 'cpu-wheel-source-notices-proof-14-days' && github.repository == 'csic21/luma-subtitle' && github.event_name == 'push' && github.ref == 'refs/heads/feat/optional-asr-engines' && !inputs.source_sha && github.workflow == 'CPU-only CTranslate2 proof' && github.workflow_ref == 'csic21/luma-subtitle/.github/workflows/asr-ct2-cpu.yml@refs/heads/feat/optional-asr-engines' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Test input locks and binary inventory logic
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10) and sys.maxsize > 2**32"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts/asr-components -p 'test_fixture_paths.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts/asr-components/ct2-cpu -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inventory official toolchain and build two CPU wheels
        shell: pwsh
        run: |
          $orchestrator = Join-Path $env:pythonLocation 'python.exe'
          $reports = Join-Path $env:GITHUB_WORKSPACE 'dist/ct2-cpu-reports'
          $publicationArgs = @()
          $diagnosticArgs = @()
          if ($env:CPU_DIAGNOSTIC_EXPORT -eq 'true') {
            $diagnosticArgs = @('--diagnostic-output', (Join-Path $env:GITHUB_WORKSPACE 'dist/ct2-cpu-diagnostic'))
          }
          if ($env:CPU_CANDIDATE_EXPORT -eq 'true') {
            $publicationArgs = @('--publication-output', (Join-Path $env:GITHUB_WORKSPACE 'dist/ct2-cpu-candidate'))
          }
          . ./scripts/asr-components/ct2-cpu/prepare_toolchain.ps1 -Reports $reports -Lock 'scripts/asr-components/ct2-cpu/sources.lock.json'
          & $orchestrator -B scripts/asr-components/ct2-cpu/build_cpu.py `
            --source-sha "$env:SOURCE_SHA" `
            --work "$env:RUNNER_TEMP/luma-ct2-cpu-proof" `
            --cache "$env:RUNNER_TEMP/luma-ct2-cpu-downloads" `
            --reports "$reports" `
            --worker 'src-tauri/src/asr/worker.py' @publicationArgs @diagnosticArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Ordinary/manual/reusable/PR routes remain metadata-only. The mutually
      # exclusive explicit request scopes retain either failed diagnostics for
      # one day or the exact successful four-file candidate for fourteen days.
      # Neither route contains runtime, CRT or model payloads.
      # The independent provenance, CRT license, hash and native inference review
      # must finish before a separate immutable non-app component release exists.
      - name: Upload test reports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ct2-cpu-proof-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dist/ct2-cpu-reports/*.json
            dist/ct2-cpu-reports/*.log
            dist/ct2-cpu-reports/*-CMakeCache.txt

      - name: Retain explicit failed-verifier diagnostic (never a release candidate)
        id: diagnostic-upload
        if: failure() && !cancelled() && env.CPU_DIAGNOSTIC_EXPORT == 'true' && hashFiles('dist/ct2-cpu-diagnostic/diagnostic-manifest.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ct2-cpu-DIAGNOSTIC-NOT-FOR-RELEASE-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          path: |
            dist/ct2-cpu-diagnostic/ctranslate2-4.8.2-1lumacpu-cp312-cp312-win_amd64.whl
            dist/ct2-cpu-diagnostic/luma-ct2-cpu-4.8.2-1-sources.zip
            dist/ct2-cpu-diagnostic/luma-ct2-cpu-4.8.2-1-notices.zip
            dist/ct2-cpu-diagnostic/diagnostic-manifest.json

      - name: Export the three reviewed candidate assets and proof only
        id: candidate-upload
        if: success() && !cancelled() && env.CPU_CANDIDATE_EXPORT == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ct2-cpu-candidate-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          path: |
            dist/ct2-cpu-candidate/ctranslate2-4.8.2-1lumacpu-cp312-cp312-win_amd64.whl
            dist/ct2-cpu-candidate/luma-ct2-cpu-4.8.2-1-sources.zip
            dist/ct2-cpu-candidate/luma-ct2-cpu-4.8.2-1-notices.zip
            dist/ct2-cpu-candidate/publication-proof.json

  windows-direct-crt-signatures:
    needs: [source-tests, request]
    if: always() && !cancelled() && needs.source-tests.result == 'success' && (needs.request.result == 'success' || inputs.source_sha || github.event_name == 'workflow_dispatch')
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha || needs.request.outputs.source_sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Test the fixed non-executing CRT extraction helper
        shell: pwsh
        run: |
          python -c "import sys; assert sys.version_info[:3] == (3, 12, 10) and sys.maxsize > 2**32"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s scripts/asr-components/ct2-cpu/direct-crt -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract exact official package members and verify native signatures
        shell: pwsh
        run: |
          $reports = Join-Path $env:GITHUB_WORKSPACE 'dist/direct-crt-reports'
          $work = Join-Path $env:RUNNER_TEMP 'luma-direct-crt-proof'
          New-Item -ItemType Directory -Path $reports -Force | Out-Null
          $manifest = Join-Path $reports 'extraction.json'
          python -B scripts/asr-components/ct2-cpu/direct-crt/audit_direct_crt.py `
            --work-dir "$work" --report "$manifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/asr-components/ct2-cpu/verify_direct_crt_signatures.ps1 `
            -Manifest $manifest -WorkRoot $work -Report (Join-Path $reports 'signatures.json')
      - name: Upload direct CRT metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-crt-proof-${{ env.SOURCE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: dist/direct-crt-reports/*.json
