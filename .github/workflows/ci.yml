name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Release guard regression tests
        run: node --test scripts/prepare-release.test.cjs scripts/publish-release.test.cjs scripts/recover-release.node-test.cjs
      - name: Optional ASR adapter tests (no ML packages or models)
        run: python -m unittest discover -s scripts -p test_asr_worker.py
      - name: Managed ASR packaging and publication guard tests
        shell: bash
        run: |
          python -B -m unittest discover -s scripts/asr-components -p 'test_*.py' -v
          node --test scripts/asr-components/publish.node-test.cjs
      - name: Frontend regression tests
        run: pnpm test
      - name: Typecheck and build
        run: pnpm build
      - name: Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Native application build without distributable packaging
        run: pnpm tauri build --no-bundle
